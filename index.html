<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
</head>

<style>

    #habits-list {
        border: 1px solid red;
        width: 200px;
        height: 200px;
        display: flex;
        flex-direction: column;

    }
    .habit-list-item1{
        display: flex;
flex-direction: column;
    }
    .habit-list-item{
        border: 1px solid green;
          display: flex;
          justify-content: center;
          align-items: center;
    /* width: 100rem; */
    height: 3rem;
gap: 1rem;
}

.hidden{
  display: none !important;
}

.habit-list-item {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    flex-direction: column;
    gap: 10px;
    border: 1px solid #ccc;
    padding: 10px;
    margin-bottom: 10px;
}

.history-box {
    width: 100%;
    display: flex;
    flex-direction: column  ;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
}

.history-day {
    font-size: 0.8rem;
    padding: 4px 8px;
    background: #f1f1f1;
    border-radius: 4px;
}

</style>

<body>

    <div>

        <input class="habit-input" type="text">
        <button class="add-habit-btn">Add Habit</button>

    </div>

    <div id="habits-list">

<!-- <div class="habit-list-item"> <p>Drink Water</p>  <button>Mark as Done</button> </div> -->

    </div>

</body>
<script src="script.js"></script>

</html>
